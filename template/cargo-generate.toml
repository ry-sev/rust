[template]
cargo_generate_version = ">=0.19.0"
# Copied without Liquid rendering, so workflows can use GitHub's `${{ }}` expressions.
exclude = [".github/workflows/*"]

[placeholders.layout]
type = "string"
prompt = "Project layout"
default = "bin"
choices = [
    { value = "bin", label = "bin        single crate, src/main.rs" },
    { value = "lib", label = "lib        single crate, src/lib.rs" },
    { value = "workspace", label = "workspace  crates/<name>/" },
    { value = "members", label = "members    workspace, <name>/ at the repo root" },
]

[placeholders.description]
type = "string"
prompt = "Description"
default = ""

[placeholders.author]
type = "string"
prompt = "Author"
default = "Ricky Severino"

[placeholders.gh_user]
type = "string"
prompt = "GitHub owner"
default = "ry-sev"

[placeholders.publish]
type = "bool"
prompt = "Publish to crates.io?"
default = false

[conditional.'layout != "lib"'.placeholders.cli]
type = "bool"
prompt = "Command-line parsing (clap)?"
default = false

[conditional.'layout != "lib"'.placeholders.async]
type = "bool"
prompt = "Async runtime (tokio)?"
default = false

[hooks]
pre = ["pre-script.rhai"]
