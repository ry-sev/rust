name: Release

# Builds the crate's executables for each platform and attaches them, with their SHA-256
# checksums, to a draft release for the pushed tag. Nothing is public until someone
# publishes the draft by hand. A crate without a binary gets a draft with notes only.
#
# Run it from the Actions tab instead and it builds the same way, but keeps the
# executables and the checksums as one workflow artifact rather than making a release.
#
# Crate names, the version, and the binaries come from `cargo metadata`, so nothing here
# names the project.
#
# Third-party actions are pinned to commits rather than tags, because a tag can be moved
# to code that tampers with what is built.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.crate.outputs.version }}
      bins: ${{ steps.crate.outputs.bins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version and binaries
        id: crate
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          version=$(jq -r '[.packages[].version] | unique | join(" ")' <<< "$metadata")
          if [[ $version == *" "* ]]; then
            echo "::error::the crates disagree on their version: $version"
            exit 1
          fi
          bins=$(jq -r '[.packages[].targets[] | select(.kind | index("bin")) | .name] | join(" ")' <<< "$metadata")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bins=$bins" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the crate would ship executables named for a version they
      # are not. Checked first, before the builds rather than after them.
      - name: Check the tag matches the crate version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.crate.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the crate version $VERSION"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: check
    if: needs.check.outputs.bins != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # A Linux executable runs on systems at least as new as the glibc it was built
          # against, so these use the oldest runner image available.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Cross-compiled on the Apple Silicon runner.
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain from rust-toolchain.toml, plus the target.
      - name: Install the toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
          BINS: ${{ needs.check.outputs.bins }}
        run: |
          cargo build --release --locked --bins --target "$TARGET"
          ext=""
          if [[ $TARGET == *-windows-* ]]; then ext=.exe; fi
          mkdir dist
          for bin in $BINS; do
            cp "target/$TARGET/release/$bin$ext" "dist/$bin-$VERSION-$TARGET$ext"
          done

      - name: Keep the executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check, build]
    # Runs when `build` was skipped for a crate without a binary, but not after it failed.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.result == 'success'
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      # One list covering every executable, so a download can be checked against a copy
      # posted somewhere other than beside the downloads.
      - name: Checksum the executables
        if: needs.build.result == 'success'
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          {
            echo "### SHA-256 checksums"
            echo
            echo "These executables are not signed. Check a download against these before"
            echo "running it: \`sha256sum --check --ignore-missing SHA256SUMS\`."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

      - name: Keep the run's executables
        if: github.event_name == 'workflow_dispatch' && needs.build.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executables
          path: dist/*
          if-no-files-found: error

      - name: Draft the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          touch "$RUNNER_TEMP/notes.md"
          files=()
          if [ -d dist ]; then files=(dist/*); fi

          # A re-run replaces the draft an earlier attempt made, so the notes always list
          # the checksums of the files actually attached. A published release is left
          # alone.
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::release $GITHUB_REF_NAME is already published; not replacing it"
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
